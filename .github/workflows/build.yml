name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Find and fix gradlew
        run: find . -name "gradlew" -exec chmod +x {} \;
      - name: Create .env file
        run: find . -name ".env.example" -execdir cp .env.example .env \; || echo "GEMINI_API_KEY=placeholder" > .env
      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" | head -1)
          cd $(dirname $GRADLEW)
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
